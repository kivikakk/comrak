[package]
name = "comrak-www"
version = "0.0.0"
rust-version = "1.89"
edition = "2024"
publish = false

[dependencies]
clap = "4"
comrak = { path = "..", default-features = false, features = ["cli", "syntect-onig"] }
shell-words = "1.1"
syntect = { version = "5", default-features = false, features = ["html", "plist-load"] }
yaml-rust = "0.4"
